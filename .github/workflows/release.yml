# Publishes a release to Maven Central when a tag like v0.1.0 is pushed. The version comes from
# the tag; the poms on main stay at the next snapshot. The build runs every test, signs every
# artifact and uploads one bundle to the Central Portal, where it is validated and then waits for
# "Publish" (autoPublish is off in pgtasks-parent). Then it creates the GitHub release from the
# tag's section of CHANGELOG.md. One-time setup and the steps: RELEASING.md.
name: release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write   # the GitHub release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_TOKEN
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: Read the version from the tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          case "$version" in *SNAPSHOT*) echo "::error::A release tag can't be a snapshot: $GITHUB_REF_NAME"; exit 1;; esac
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no section '## [$version]'"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Set the version
        run: >-
          mvn -B -ntp org.codehaus.mojo:versions-maven-plugin:2.19.1:set
          -DnewVersion=${{ steps.version.outputs.version }}
          -DprocessAllModules -DgenerateBackupPoms=false
      - name: Build, test, sign and upload
        run: mvn -B -ntp -Prelease deploy
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^(## \[|\[[^]]+\]: )/ { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md
          prerelease=""
          case "$VERSION" in 0.*|*-*) prerelease="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "pgtasks $VERSION" --notes-file release-notes.md $prerelease
      - name: Keep test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/target/surefire-reports/'
          retention-days: 7
