# Builds and tests every module on Linux, including the store TCK and the engine's Postgres
# tests on an embedded Postgres (no Docker needed). The build job runs on the default Postgres
# (embedded-postgres-binaries.version in pgtasks-parent); the postgres job repeats the
# Postgres-dependent modules on every other supported major version.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and test
        run: mvn -B -ntp clean install
      - name: Keep test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/target/surefire-reports/'
          retention-days: 7

  postgres:
    name: postgres ${{ matrix.postgres }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Every supported version (TaskSchema.MIN_POSTGRES_VERSION on); 17 is the default the build job runs on.
        postgres: ['18', '19']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Test on Postgres ${{ matrix.postgres }}
        run: >-
          mvn -B -ntp verify
          -pl pgtasks-postgres,pgtasks-engine,pgtasks-spring-boot-starter -am
          -Dpgtasks.test.postgres.version=${{ matrix.postgres }}
      - name: Keep test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-postgres-${{ matrix.postgres }}
          path: '**/target/surefire-reports/'
          retention-days: 7

  fray:
    # Explores thread interleavings of the engine's coordination code (the *FrayTest classes) on
    # Fray's instrumented JDK, which the plugin downloads into target/fray.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Fray tests
        run: >-
          mvn -B -ntp verify -pl pgtasks-engine -am -Pfray
          -Dtest='*FrayTest' -Dsurefire.failIfNoSpecifiedTests=false
      - name: Keep Fray reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fray-reports
          path: |
            pgtasks-engine/target/surefire-reports/
            pgtasks-engine/target/fray/fray-report/
          retention-days: 7
